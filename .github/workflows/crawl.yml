name: AI Stock News Automation

on:
  schedule:
    # GitHub 使用的是 UTC 时间，北京时间 08:00 对应 UTC 00:00
    - cron: '22 23 * * *'    # 每日早 8 点触发 (早晨报告)
    # 北京时间 23:30 对应 UTC 15:30
    - cron: '30 11 * * *'  # 每日晚 23:30 触发 (晚间汇总)
  workflow_dispatch:        # 支持在网页上手动点击运行

jobs:
  run-news-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Inject Secrets into Config
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          # 1. 如果 config.yaml 不存在，才从模板复制（避免覆盖已提交的 config.yaml）
          if [ ! -f config.yaml ]; then
            if [ -f config.yaml.template ]; then
              cp config.yaml.template config.yaml
            elif [ -f config.yaml.example ]; then
              cp config.yaml.example config.yaml
            else
              echo "Error: config.yaml or template not found!"
              exit 1
            fi
          fi

          # 2. 安全注入 Secrets 并重定向 OpenRouter 到 DeepSeek 官方接口
          python -c "
          import os, yaml

          config_file = 'config.yaml'
          with open(config_file, 'r', encoding='utf-8') as f:
              data = yaml.safe_load(f) or {}

          # 获取 Secrets 并自动剔除空白字符
          ds_key = os.getenv('DEEPSEEK_API_KEY', '').strip()
          email_pwd = os.getenv('EMAIL_PASSWORD', '').strip()

          if not ds_key:
              print('❌ 警告: DEEPSEEK_API_KEY 读取为空！请检查 GitHub Secrets。')
          else:
              # 设置 deepseek 配置
              data.setdefault('ai_analysis', {}).setdefault('deepseek', {})['api_key'] = ds_key
              
              # 强制将 openrouter 配置也定向至 DeepSeek 官方，防止调错接口
              data.setdefault('ai_analysis', {}).setdefault('openrouter', {})['api_key'] = ds_key
              data.setdefault('ai_analysis', {}).setdefault('openrouter', {})['base_url'] = 'https://api.deepseek.com'
              data.setdefault('ai_analysis', {}).setdefault('openrouter', {})['model'] = 'deepseek-chat'

          if email_pwd:
              data.setdefault('email', {}).setdefault('smtp', {})['password'] = email_pwd

          with open(config_file, 'w', encoding='utf-8') as f:
              yaml.dump(data, f, allow_unicode=True, default_flow_style=False)

          # 校验并打印 Key 长度（保证安全性，不暴露明文）
          written_key = data.get('ai_analysis', {}).get('deepseek', {}).get('api_key', '')
          print(f'✅ 配置注入完成！DeepSeek Key 写入长度为: {len(written_key)} 位')
          "

      - name: Run News Collector and AI Analysis
        run: |
          # 运行项目主启动入口文件（根据项目实际入口文件名调整，如 main.py）
          python main.py run-once

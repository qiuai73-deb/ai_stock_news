name: AI Stock News Automation

on:
  schedule:
    # GitHub 使用的是 UTC 时间，北京时间 08:00 对应 UTC 00:00
    - cron: '22 23 * * *'    # 每日早 8 点触发 (早晨报告)
    # 北京时间 23:30 对应 UTC 15:30
    - cron: '30 11 * * *'  # 每日晚 23:30 触发 (晚间汇总)
  workflow_dispatch:        # 支持在网页上手动点击运行

jobs:
  run-news-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Inject Secrets into Config and Environment
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          # 1. 如果 config.yaml 不存在，尝试复制模板
          if [ ! -f config.yaml ]; then
            cp config.yaml.template config.yaml 2>/dev/null || cp config.yaml.example config.yaml 2>/dev/null || true
          fi

          # 2. 运行 Python 脚本把 Secrets 写入 config.yaml，并打印检查信息
          python -c "
          import os, yaml

          ds_key = os.getenv('DEEPSEEK_API_KEY', '').strip()
          email_pwd = os.getenv('EMAIL_PASSWORD', '').strip()

          config_file = 'config.yaml'
          try:
              with open(config_file, 'r', encoding='utf-8') as f:
                  data = yaml.safe_load(f) or {}
          except Exception as e:
              data = {}

          # 更新 deepseek 配置
          data.setdefault('ai_analysis', {}).setdefault('deepseek', {})['api_key'] = ds_key
          data.setdefault('ai_analysis', {}).setdefault('deepseek', {})['base_url'] = 'https://api.deepseek.com'
          
          # 强制将 openrouter 重定向至 deepseek 官方，防走错通道
          data.setdefault('ai_analysis', {}).setdefault('openrouter', {})['api_key'] = ds_key
          data.setdefault('ai_analysis', {}).setdefault('openrouter', {})['base_url'] = 'https://api.deepseek.com'
          data.setdefault('ai_analysis', {}).setdefault('openrouter', {})['model'] = 'deepseek-reasoner'

          # 更新 邮箱密码与 SSL 修正
          if email_pwd:
              data.setdefault('email', {}).setdefault('smtp', {})['password'] = email_pwd
          data.setdefault('email', {}).setdefault('smtp', {})['use_ssl'] = True
          data.setdefault('email', {}).setdefault('smtp', {})['use_tls'] = False

          with open(config_file, 'w', encoding='utf-8') as f:
              yaml.dump(data, f, allow_unicode=True, default_flow_style=False)

          print('--- Secret 注入结果检查 ---')
          print('读取到的 Key 长度:', len(ds_key))
          if ds_key:
              print('Key 前缀检查:', ds_key[:4] + '...')
          else:
              print('❌ 错误: Secrets 中的 DEEPSEEK_API_KEY 为空！')
          "

      - name: Test DeepSeek API Key Directly
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python -c "
          import urllib.request, json, os

          key = os.getenv('DEEPSEEK_API_KEY', '').strip()
          url = 'https://api.deepseek.com/chat/completions'
          headers = {
              'Content-Type': 'application/json',
              'Authorization': f'Bearer {key}'
          }
          payload = {
              'model': 'deepseek-chat',
              'messages': [{'role': 'user', 'content': 'hi'}],
              'max_tokens': 5
          }

          req = urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'), headers=headers)
          try:
              with urllib.request.urlopen(req) as response:
                  res = json.loads(response.read().decode('utf-8'))
                  print('✅ DeepSeek API Key 验证成功！响应:', res['choices'][0]['message']['content'])
          except Exception as e:
              print('❌ API 测试失败！详细报错信息:', e)
              exit(1)
          "
      
      
      
      - name: Run News Collector and AI Analysis
        run: |
          # 运行项目主启动入口文件（根据项目实际入口文件名调整，如 main.py）
          python main.py run-once

name: AI Stock News Automation

on:
  schedule:
    # GitHub 使用的是 UTC 时间，北京时间 08:00 对应 UTC 00:00
    - cron: '22 23 * * *'    # 每日早 8 点触发 (早晨报告)
    # 北京时间 23:30 对应 UTC 15:30
    - cron: '30 11 * * *'  # 每日晚 23:30 触发 (晚间汇总)
  workflow_dispatch:        # 支持在网页上手动点击运行

jobs:
  run-news-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Inject Secrets into Config
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # 1. 检查配置文件是否存在，如果不存在则用模板复制，如果都没有则报错提示
          if [ -f config.yaml.template ]; then
            cp config.yaml.template config.yaml
          elif [ -f config.yaml.example ]; then
            cp config.yaml.example config.yaml
          elif [ ! -f config.yaml ]; then
            echo "Error: config.yaml file or template does not exist!"
            exit 1
          fi

          # 2. 使用 Python 脚本安全注入 Secrets（不会因特殊字符报错）
          python -c "
          import os, yaml

          config_file = 'config.yaml'
          with open(config_file, 'r', encoding='utf-8') as f:
              data = yaml.safe_load(f) or {}

          # 替换 DeepSeek API Key
          if os.getenv('DEEPSEEK_API_KEY'):
              data.setdefault('ai_analysis', {}).setdefault('deepseek', {})['api_key'] = os.getenv('DEEPSEEK_API_KEY')

          # 替换 OpenRouter API Key
          if os.getenv('OPENROUTER_API_KEY'):
              data.setdefault('ai_analysis', {}).setdefault('openrouter', {})['api_key'] = os.getenv('OPENROUTER_API_KEY')

          # 替换 邮箱授权码
          if os.getenv('EMAIL_PASSWORD'):
              data.setdefault('email', {}).setdefault('smtp', {})['password'] = os.getenv('EMAIL_PASSWORD')

          with open(config_file, 'w', encoding='utf-8') as f:
              yaml.dump(data, f, allow_unicode=True, default_flow_style=False)

          print('Config successfully updated with secrets.')
          "

      - name: Run News Collector and AI Analysis
        run: |
          # 运行项目主启动入口文件（根据项目实际入口文件名调整，如 main.py）
          python main.py run-once
